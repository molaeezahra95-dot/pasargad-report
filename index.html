<title>گزارش پاسارگاد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
    --gold:#c9a84c;--bg:#0f1a14;--card:#162011;
    --border:rgba(201,168,76,0.18);--up:#17a2b8;--dn:#d95f5f;
    --teal:#1fc8e3;--green:#28a745;--txt:#dde8d8;--muted:#7a9070;
}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;max-width:480px;margin:0 auto;}
.hdr{background:linear-gradient(180deg,#1a3020,#0f1e12);padding:12px 14px;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.hdr-left{display:flex;align-items:center;gap:8px;}
.hdr-title{font-size:13px;font-weight:800;color:var(--gold);}
.hdr-right{text-align:left;}
.hdr-date{background:var(--gold);color:#0d2010;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;display:inline-block;}
.hdr-upd{font-size:10px;color:var(--muted);margin-top:3px;text-align:left;}
.time-strip{background:#0d1a10;border-bottom:1px solid var(--border);padding:6px 12px;display:flex;gap:6px;position:sticky;top:50px;z-index:40;overflow-x:auto;scrollbar-width:none;}
.time-strip::-webkit-scrollbar{display:none;}
.ttab{padding:4px 14px;border-radius:16px;font-size:11px;font-weight:700;cursor:pointer;border:1px solid rgba(201,168,76,0.3);background:transparent;color:var(--muted);font-family:'Vazirmatn',sans-serif;transition:all 0.2s;white-space:nowrap;}
.ttab.active{background:var(--gold);color:#0d2010;border-color:var(--gold);}
.content{padding:10px 10px 30px;}
.acc-item{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;overflow:hidden;transition:border-color 0.2s;}
.acc-item.open{border-color:rgba(201,168,76,0.45);}
.acc-head{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;}
.ah-name{font-size:17px;font-weight:800;color:var(--gold);min-width:52px;}
.ah-chg{font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;direction:ltr;min-width:62px;text-align:center;}
.up{background:rgba(23,162,184,0.12);color:var(--up);border:1px solid rgba(23,162,184,0.28);}
.dn{background:rgba(217,95,95,0.12);color:var(--dn);border:1px solid rgba(217,95,95,0.28);}
.zt{background:rgba(122,144,112,0.12);color:var(--muted);border:1px solid rgba(122,144,112,0.28);}
.ah-mid{flex:1;text-align:left;}
.ah-price{font-size:14px;font-weight:700;direction:ltr;}
.ah-sub{font-size:10px;color:var(--muted);direction:ltr;margin-top:2px;}
.ah-sub b{color:var(--teal);}
.ah-arrow{font-size:13px;color:var(--muted);transition:transform 0.25s;margin-right:2px;}
.acc-item.open .ah-arrow{transform:rotate(90deg);}
.acc-body{max-height:0;overflow:hidden;transition:max-height 0.32s cubic-bezier(0.4,0,0.2,1);}
.acc-item.open .acc-body{max-height:600px;}
.acc-inner{border-top:1px solid var(--border);padding:12px;background:#111e0e;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px;}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:5px;margin-bottom:7px;}
.cell{background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:9px;padding:9px 10px;}
.cl{font-size:9px;color:var(--muted);margin-bottom:3px;}
.cv{font-size:13px;font-weight:700;direction:ltr;text-align:right;}
.c-up{color:var(--up);} .c-dn{color:var(--dn);} .c-teal{color:var(--teal);}
.c-gold{color:var(--gold);} .c-green{color:var(--green);} .c-muted{color:var(--muted);}
.flowbar{background:var(--card);border:1px solid rgba(201,168,76,0.12);border-radius:9px;padding:10px 12px;margin-bottom:7px;}
.fb-track{height:8px;border-radius:20px;background:rgba(220,53,69,0.35);overflow:hidden;margin-bottom:5px;}
.fb-fill{height:100%;border-radius:20px;background:var(--green);}
.fb-nums{display:flex;justify-content:space-between;font-size:10px;font-weight:700;direction:ltr;}
.det-badge{display:inline-block;font-size:9px;padding:2px 8px;border-radius:10px;font-weight:700;margin-bottom:8px;}
.ok{background:rgba(23,162,184,0.1);color:var(--up);border:1px solid rgba(23,162,184,0.3);}
.stop{background:rgba(217,95,95,0.1);color:var(--dn);border:1px solid rgba(217,95,95,0.3);}
.refresh-bar{background:rgba(201,168,76,0.05);border:1px solid rgba(201,168,76,0.15);border-radius:8px;padding:6px 12px;margin:0 10px 8px;text-align:center;font-size:10px;color:var(--muted);}
.ftr{background:#0d1a10;border-top:1px solid var(--border);color:var(--muted);text-align:center;padding:8px;font-size:10px;}
</style>
</head>

            + '<div class="ah-arrow">&#8250;</div>'
            + '</div>'
            + '<div class="acc-body"><div class="acc-inner">'
            + '<span class="det-badge ' + sCls + '">' + s.status + '</span>'
            + '<div class="g2">'
            + '<div class="cell"><div class="cl">حجم معاملات</div><div class="cv c-gold">' + fV(s.volume) + '</div></div>'
            + '<div class="cell"><div class="cl">ارزش معاملات</div><div class="cv c-teal">' + fMTAbs(s.value) + '</div></div>'
            + '</div>'
            + '<div class="cell" style="margin-bottom:7px"><div class="cl">ورود پول حقیقی</div><div class="cv ' + mCls + '">' + mTxt + '</div></div>'
            + flowBar
            + '<div class="g4">'
            + '<div class="cell"><div class="cl">خرید ح.ح</div><div class="cv c-green">' + fV(s.retailBuy) + '</div></div>'
            + '<div class="cell"><div class="cl">فروش ح.ح</div><div class="cv c-dn">' + fV(s.retailSell) + '</div></div>'
            + '<div class="cell"><div class="cl">خرید ح.ق</div><div class="cv c-green">' + fV(s.instBuy) + '</div></div>'
            + '<div class="cell"><div class="cl">فروش ح.ق</div><div class="cv c-dn">' + fV(s.instSell) + '</div></div>'
            + '</div>'
            + '<div class="cell"><div class="cl">میانگین حجم ماهانه</div><div class="cv c-muted">' + fV(s.avgVolume) + '</div></div>'
            + '</div></div></div>';
    }).join('');
}

function show(idx) {
    curIdx = idx;
    renderTabs();
    document.getElementById('content').innerHTML = renderStocks(allData[idx].stocks);
}

function toggle(i) {
    var el = document.getElementById('acc-' + i);
    var wasOpen = el.classList.contains('open');
    document.querySelectorAll('.acc-item').forEach(function(a) { a.classList.remove('open'); });
    if (!wasOpen) el.classList.add('open');
}

renderTabs();
document.getElementById('content').innerHTML = renderStocks(allData[curIdx].stocks);
</script>
</body></html>
