<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<meta http-equiv="refresh" content="300">
<title>گزارش پاسارگاد</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c9a84c; --bg:#f4f5f2; --card:#ffffff;
  --border:#e5e7eb; --up:#16a34a; --dn:#dc2626;
  --teal:#0891b2; --txt:#111827; --muted:#6b7280;
}
body{
  font-family:'Vazirmatn',Tahoma,sans-serif;
  background:var(--bg);color:var(--txt);
  display:flex;flex-direction:column;
  max-width:480px;margin:0 auto;
  overflow:hidden;height:100vh;
}
/* ===== HEADER ===== */
.hdr{
  background:#fff;border-bottom:2px solid var(--gold);
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  padding:10px 14px 0;flex-shrink:0;
}
.hdr-top{
  display:grid;grid-template-columns:1fr auto 1fr;
  align-items:center;margin-bottom:6px;gap:4px;
}
.hdr-index{text-align:right;}
.idx-num{font-size:13px;font-weight:800;color:var(--txt);direction:ltr;}
.idx-chg{font-size:11px;font-weight:700;}
.idx-lbl{font-size:9px;color:var(--muted);}
.idx-up{color:var(--up);} .idx-dn{color:var(--dn);}
.hdr-center{text-align:center;}
.hdr-title{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;}
.hdr-right{text-align:left;}
.hdr-date{
  font-size:11px;font-weight:700;background:var(--gold);
  color:#fff;padding:2px 8px;border-radius:12px;display:inline-block;
}
.hdr-upd{font-size:9px;color:var(--muted);margin-top:2px;}
/* ===== TIME STRIP ===== */
.time-strip{
  background:#fafafa;border-bottom:1px solid var(--border);
  padding:4px 10px;display:flex;gap:4px;
  overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.time-strip::-webkit-scrollbar{display:none;}
.ttab{
  padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;
  cursor:pointer;border:1px solid var(--border);background:#fff;
  color:var(--muted);font-family:'Vazirmatn',sans-serif;
  white-space:nowrap;transition:all .2s;
}
.ttab.active{background:var(--gold);color:#fff;border-color:var(--gold);}
/* ===== STOCK TABS ===== */
.page-tabs{
  background:#fff;border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;scrollbar-width:none;flex-shrink:0;
}
.page-tabs::-webkit-scrollbar{display:none;}
.ptab{
  padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;
  font-family:'Vazirmatn',sans-serif;
  background:none;border-top:none;border-left:none;border-right:none;
  transition:all .2s;flex-shrink:0;
}
.ptab.active{color:var(--gold);border-bottom-color:var(--gold);}
/* ===== SLIDER ===== */
.slider-wrap{flex:1;overflow:hidden;position:relative;}
.slider{
  display:flex;height:100%;
  transition:transform .35s cubic-bezier(.4,0,.2,1);
  will-change:transform;
}
.slide{
  min-width:100%;height:100%;
  overflow-y:auto;padding:12px 12px 24px;
  -webkit-overflow-scrolling:touch;
}
/* ===== SUMMARY PAGE ===== */
.sum-grid{display:flex;flex-direction:column;gap:8px;}
.sum-row{
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:12px 14px;display:flex;align-items:center;gap:10px;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);
  transition:box-shadow .15s;
}
.sum-row:active{box-shadow:0 3px 10px rgba(0,0,0,.1);}
.sr-name{font-size:17px;font-weight:800;color:var(--txt);min-width:52px;}
.sr-chg{
  font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px;
  direction:ltr;min-width:60px;text-align:center;
}
.up{background:#f0fdf4;color:var(--up);border:1px solid #bbf7d0;}
.dn{background:#fef2f2;color:var(--dn);border:1px solid #fecaca;}
.zt{background:#f9fafb;color:var(--muted);border:1px solid var(--border);}
.sr-right{flex:1;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
.sr-price{font-size:15px;font-weight:800;direction:ltr;color:var(--txt);}
.sr-metrics{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;}
.sr-m{
  font-size:10px;background:#f9fafb;border:1px solid var(--border);
  border-radius:6px;padding:2px 7px;direction:ltr;color:var(--txt);
}
.sr-m .lbl{font-size:8px;color:var(--muted);margin-left:2px;}
.hint{font-size:10px;color:var(--muted);text-align:center;margin-top:10px;padding:6px;}
/* ===== DETAIL PAGE ===== */
.stk-hero{
  background:#fff;border:1px solid var(--border);border-radius:14px;
  border-top:3px solid var(--gold);padding:16px;text-align:center;
  margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.sh-name{font-size:22px;font-weight:800;color:var(--txt);margin-bottom:4px;}
.sh-badge{
  display:inline-block;font-size:10px;padding:2px 10px;
  border-radius:16px;font-weight:700;margin-bottom:8px;
}
.ok{background:#f0fdf4;color:var(--up);border:1px solid #bbf7d0;}
.stop{background:#fef2f2;color:var(--dn);border:1px solid #fecaca;}
.sh-prices{
  display:flex;justify-content:center;align-items:baseline;
  gap:10px;margin-bottom:4px;
}
.sh-last{font-size:26px;font-weight:800;direction:ltr;}
.sh-chg{font-size:13px;font-weight:800;padding:3px 10px;border-radius:20px;direction:ltr;}
.sh-close{font-size:11px;color:var(--muted);margin-top:2px;}
.sh-close b{color:var(--teal);}
.sec-lbl{
  font-size:10px;font-weight:700;color:var(--gold);
  border-right:3px solid var(--gold);padding-right:6px;
  margin:10px 0 6px;
}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.cell{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.cl{font-size:9px;color:var(--muted);margin-bottom:4px;font-weight:600;}
.cv{font-size:13px;font-weight:800;direction:ltr;text-align:right;}
.c-up{color:var(--up);} .c-dn{color:var(--dn);}
.c-teal{color:var(--teal);} .c-gold{color:var(--gold);}
.c-txt{color:var(--txt);} .c-muted{color:var(--muted);}
.flowbar{
  background:var(--card);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;margin-bottom:6px;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
}
.fb-lbl{font-size:9px;color:var(--muted);margin-bottom:6px;font-weight:600;}
.fb-track{
  height:8px;border-radius:20px;
  background:#fecaca;overflow:hidden;margin-bottom:5px;
}
.fb-fill{height:100%;border-radius:20px;background:#4ade80;}
.fb-nums{
  display:flex;justify-content:space-between;
  font-size:10px;font-weight:700;direction:ltr;
}
</style>
</head>

/* ── Formatting helpers ── */
function fVol(n) {
  if (!n) return '—';
  var m = n / 1e6;
  if (m >= 1) return (m >= 10 ? Math.round(m) : parseFloat(m.toFixed(1))).toLocaleString('fa-IR') + ' میلیون سهم';
  return n.toLocaleString('fa-IR') + ' سهم';
}
function fVal(n) {
  if (!n) return '—';
  var b = n / 1e10;
  if (b >= 1) return (b >= 10 ? Math.round(b) : parseFloat(b.toFixed(1))).toLocaleString('fa-IR') + ' میلیارد تومان';
  return parseFloat((b * 1000).toFixed(0)).toLocaleString('fa-IR') + ' میلیون تومان';
}
function fFlow(n) {
  if (!n) return '—';
  var b = Math.abs(n) / 1e10;
  var sign = n > 0 ? '+' : '-';
  return sign + (b >= 10 ? Math.round(b) : parseFloat(b.toFixed(1))).toLocaleString('fa-IR') + ' میلیارد تومان';
}
function fMC(n) {
  if (!n) return '—';
  var v = parseFloat(n);
  return (v >= 10 ? Math.round(v) : parseFloat(v.toFixed(1))).toLocaleString('fa-IR') + ' همت';
}
function fPrice(n) {
  if (!n) return '—';
  return n.toLocaleString('fa-IR') + ' تومان';
}
function cc(c) { return c > 0 ? 'up' : c < 0 ? 'dn' : 'zt'; }
function cv(c) { return c > 0 ? 'c-up' : c < 0 ? 'c-dn' : 'c-muted'; }

/* ── Build summary slide ── */
function buildSummary(stocks) {
  if (!stocks || !stocks.length) return '<div style="padding:30px;text-align:center;color:#888">داده‌ای موجود نیست</div>';
  var html = '<div class="sum-grid">';
  stocks.forEach(function(s, si) {
    var sign = s.change > 0 ? '+' : '';
    html += '<div class="sum-row" onclick="goSlide(' + (si + 1) + ')">'
      + '<div class="sr-name">' + s.name + '</div>'
      + '<div class="sr-chg ' + cc(s.change) + '">' + sign + s.change + '%</div>'
      + '<div class="sr-right">'
      + '<div class="sr-price">' + fPrice(s.lastPrice) + '</div>'
      + '<div class="sr-metrics">'
      + '<div class="sr-m"><span class="lbl">حجم </span>' + fVol(s.volume) + '</div>'
      + '<div class="sr-m"><span class="lbl">ارزش </span>' + fVal(s.value) + '</div>'
      + '</div>'
      + '</div>'
      + '</div>';
  });
  html += '</div><div class="hint">روی نماد بزن برای جزئیات ◄</div>';
  return html;
}

/* ── Build detail slide ── */
function buildDetail(s) {
  var sign = s.change > 0 ? '+' : '';
  var chgStr = sign + s.change + '%';
  var sBadge = s.status === 'مجاز' ? 'ok' : 'stop';
  var priceCls = cv(s.change);
  var tot = (s.retailBuy || 0) + (s.retailSell || 0);
  var bp  = tot > 0 ? Math.round(s.retailBuy / tot * 100) : 0;
  var flowCls = (s.moneyFlow || 0) >= 0 ? 'c-up' : 'c-dn';

  var html = '<div class="stk-hero">'
    + '<div class="sh-name">' + s.name + '</div>'
    + '<div class="sh-badge ' + sBadge + '">' + s.status + '</div>'
    + '<div class="sh-prices">'
    + '<div class="sh-last ' + priceCls + '">' + (s.lastPrice || 0).toLocaleString('fa-IR') + '</div>'
    + '<div class="sh-chg ' + cc(s.change) + '">' + chgStr + '</div>'
    + '</div>'
    + '<div class="sh-close">پایانی: <b>' + (s.closingPrice || 0).toLocaleString('fa-IR') + '</b> تومان</div>'
    + '</div>';

  html += '<div class="sec-lbl">قیمت و ارزش بازار</div>'
    + '<div class="g2">'
    + '<div class="cell"><div class="cl">قیمت دیروز</div><div class="cv c-muted">' + fPrice(s.prevPrice) + '</div></div>'
    + '<div class="cell"><div class="cl">ارزش بازار</div><div class="cv c-gold">' + fMC(s.marketCap) + '</div></div>'
    + '</div>';

  html += '<div class="sec-lbl">حجم و ارزش معاملات</div>'
    + '<div class="g2">'
    + '<div class="cell"><div class="cl">حجم معاملات</div><div class="cv c-teal">' + fVol(s.volume) + '</div></div>'
    + '<div class="cell"><div class="cl">ارزش معاملات</div><div class="cv c-txt">' + fVal(s.value) + '</div></div>'
    + '</div>'
    + '<div class="cell" style="margin-bottom:6px"><div class="cl">میانگین حجم ماهانه</div><div class="cv c-muted">' + fVol(s.avgVolume) + '</div></div>';

  html += '<div class="sec-lbl">ورود پول حقیقی</div>'
    + '<div class="cell" style="margin-bottom:6px"><div class="cl">جریان پول</div><div class="cv ' + flowCls + '">' + fFlow(s.moneyFlow) + '</div></div>';

  if (tot > 0) {
    html += '<div class="flowbar">'
      + '<div class="fb-lbl">نسبت خرید به فروش حقیقی</div>'
      + '<div class="fb-track"><div class="fb-fill" style="width:' + bp + '%"></div></div>'
      + '<div class="fb-nums"><span class="c-up">خرید ' + bp + '%</span><span class="c-dn">فروش ' + (100 - bp) + '%</span></div>'
      + '</div>';
  }

  html += '<div class="sec-lbl">حقیقی</div>'
    + '<div class="g2">'
    + '<div class="cell"><div class="cl">خرید حقیقی</div><div class="cv c-up">' + fVol(s.retailBuy) + '</div></div>'
    + '<div class="cell"><div class="cl">فروش حقیقی</div><div class="cv c-dn">' + fVol(s.retailSell) + '</div></div>'
    + '</div>';

  html += '<div class="sec-lbl">حقوقی</div>'
    + '<div class="g2">'
    + '<div class="cell"><div class="cl">خرید حقوقی</div><div class="cv c-up">' + fVol(s.instBuy) + '</div></div>'
    + '<div class="cell"><div class="cl">فروش حقوقی</div><div class="cv c-dn">' + fVol(s.instSell) + '</div></div>'
    + '</div>';

  return html;
}

/* ── Navigation ── */
function goSlide(si) {
  curSi = si;
  document.getElementById('slider').style.transform = 'translateX(' + (si * 100) + '%)';
  document.querySelectorAll('.ptab').forEach(function(t, i) { t.classList.toggle('active', i === si); });
  var tabs = document.querySelectorAll('.ptab');
  if (tabs[si]) tabs[si].scrollIntoView({behavior: 'smooth', block: 'nearest', inline: 'center'});
}

function showTime(ti) {
  curTi = ti;
  document.querySelectorAll('.ttab').forEach(function(t, i) { t.classList.toggle('active', i === ti); });
  renderSlides();
}

/* ── Render ── */
function renderTimeTabs() {
  document.getElementById('timeStrip').innerHTML = allData.map(function(d, i) {
    return '<button class="ttab' + (i === curTi ? ' active' : '') + '" onclick="showTime(' + i + ')">' + d.time + '</button>';
  }).join('');
}

function renderPageTabs(stocks) {
  var names = ['خلاصه'].concat((stocks || []).map(function(s) { return s.name; }));
  document.getElementById('pageTabs').innerHTML = names.map(function(n, i) {
    return '<button class="ptab' + (i === curSi ? ' active' : '') + '" onclick="goSlide(' + i + ')">' + n + '</button>';
  }).join('');
}

function renderSlides() {
  var stocks = (allData[curTi] || {}).stocks || [];
  var slides = ['<div class="slide">' + buildSummary(stocks) + '</div>'];
  stocks.forEach(function(s) {
    slides.push('<div class="slide">' + buildDetail(s) + '</div>');
  });
  var sl = document.getElementById('slider');
  sl.innerHTML = slides.join('');
  sl.style.transition = 'none';
  sl.style.transform  = 'translateX(' + (curSi * 100) + '%)';
  setTimeout(function() { sl.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)'; }, 30);
}

function init() {
  if (!allData.length) return;
  renderTimeTabs();
  var stocks = (allData[curTi] || {}).stocks || [];
  renderPageTabs(stocks);
  renderSlides();
}

/* ── Swipe ── */
var startX = 0;
document.getElementById('wrap').addEventListener('touchstart', function(e) {
  startX = e.touches[0].clientX;
}, {passive: true});
document.getElementById('wrap').addEventListener('touchend', function(e) {
  var dx    = e.changedTouches[0].clientX - startX;
  var total = (document.querySelectorAll('.slide') || []).length;
  if (Math.abs(dx) > 50) {
    if (dx < 0 && curSi < total - 1) goSlide(curSi + 1);
    else if (dx > 0 && curSi > 0)   goSlide(curSi - 1);
  }
});

init();
</script>
</body>
</html>
